[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-engine"
version = "2.1.0.dev0"
description = "Gap Engine v2: a verified, compounding discovery engine (U1-U5 on top of the Gap Engine kernel)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "scikit-learn>=1.3",
  "cryptography>=45,<51",
  "networkx>=3.2",
  "packaging>=23",
]

[project.scripts]
gap-engine = "gap_engine.cli:main"
genesis = "genesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
