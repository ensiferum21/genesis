[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-engine"
version = "2.0.0"
description = "Gap Engine v2: a verified, compounding discovery engine (U1-U5 on top of the Gap Engine kernel)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "scikit-learn>=1.3",
  "cryptography>=45,<47",
]

[project.scripts]
gap-engine = "gap_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
